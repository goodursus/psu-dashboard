services:
  - type: web
    name: psu-dashboard
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    healthCheckPath: "/"
    healthCheckTimeout: 30
    healthCheckInterval: 30
    healthCheckGracePeriod: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: MQTT_BROKER
        value: 72c1c13ede99499e8d74eae70437db9b.s1.eu.hivemq.cloud
      - key: MQTT_PORT
        value: 8883
      - key: MQTT_USERNAME
        value: Ursus
      - key: MQTT_PASSWORD
        value: Ursus_123
    autoDeploy: true
    numInstances: 1
